name: Release Obsidian Plugin
on:
  push:
    tags: ['*']

permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release versions and notes
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, access } from 'node:fs/promises';
          const version = process.env.GITHUB_REF_NAME;
          assert.match(version, /^\d+\.\d+\.\d+$/);
          const read = async path => JSON.parse(await readFile(path, 'utf8'));
          const manifest = await read('manifest.json');
          const pkg = await read('package.json');
          const lock = await read('package-lock.json');
          const versions = await read('versions.json');
          for (const actual of [manifest.version, pkg.version, lock.version, lock.packages[''].version]) {
            assert.equal(actual, version, 'Tag and package/manifest versions must match');
          }
          assert.equal(versions[version], manifest.minAppVersion);
          await access(`docs/releases/${version}.md`);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust and WASM target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
      - uses: actions/cache/restore@v4
        id: wasm-pack
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install wasm-pack
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.1 --locked
      - uses: actions/cache/save@v4
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.1-${{ runner.os }}-${{ runner.arch }}
      - name: Build production plugin
        run: make build
      - name: Package plugin
        env:
          PLUGIN_NAME: typing-transformer-obsidian
        run: |
          mkdir "$PLUGIN_NAME"
          cp main.js manifest.json styles.css README.md "$PLUGIN_NAME/"
          zip -r "${PLUGIN_NAME}-${GITHUB_REF_NAME}.zip" "$PLUGIN_NAME"
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/releases/${GITHUB_REF_NAME}.md" \
            main.js manifest.json styles.css "typing-transformer-obsidian-${GITHUB_REF_NAME}.zip"
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest
