name: Regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Unit, WASM and Obsidian regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Set up Rust and WASM target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
      - uses: actions/cache/restore@v4
        id: wasm-pack
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install wasm-pack
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        run: cargo install wasm-pack --version 0.15.1 --locked
      - uses: actions/cache/save@v4
        if: steps.wasm-pack.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-0.15.1-${{ runner.os }}-${{ runner.arch }}
      - name: Build production plugin
        run: make build
      - name: Lint and typecheck
        run: |
          npm run lint
          npm run typecheck
      - name: Unit, production event boundaries and real WASM
        run: npm run test:coverage -- --run
      - uses: actions/cache@v4
        with:
          path: .obsidian-cache
          key: obsidian-1.14.4-installer-1.9.14-${{ runner.os }}-${{ runner.arch }}
      - name: Install virtual desktop
        run: sudo apt-get update -q && sudo apt-get install -y xvfb openbox
      - name: Real Obsidian regression
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" bash -c 'openbox > /tmp/tt-openbox.log 2>&1 & npm run test:e2e'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_attempt }}
          path: |
            coverage/
            artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
